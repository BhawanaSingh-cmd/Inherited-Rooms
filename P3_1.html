:root{--ink:#14080f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:transparent;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px 12px;color:var(--ink)}
.stack{width:min(380px,100%);display:flex;flex-direction:column;align-items:center;gap:16px}
.prop{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 10px 16px rgba(0,0,0,.38))}
.card{width:84%;background:#f5eedb;border:2px solid var(--ink);border-radius:3px;padding:5px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.in{border:1px solid var(--ink);padding:9px 12px 10px}
.top{display:flex;justify-content:space-between;gap:8px;font:600 7.2px/1.3 Poppins,sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.rule{border:0;border-top:3px double var(--ink);margin:6px 0 7px}
.no{font:600 7.6px Poppins,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#8a2a1a}
h1{font:600 16.5px/1.2 "Playfair Display",Georgia,serif;margin:2px 0 6px}
dl{font-variant-numeric:lining-nums;margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 12px;font:400 10px/1.35 "Playfair Display",Georgia,serif}
dt{font:600 6.8px/2 Poppins,sans-serif;letter-spacing:1.6px;text-transform:uppercase;opacity:.7;white-space:nowrap}
dd{margin:0}
.desc{font:italic 400 10.5px/1.45 "Playfair Display",Georgia,serif;margin:8px 0 0;padding-top:7px;border-top:1px solid #14080f55}

.stack{width:min(400px,100%)}
.panel{width:100%;border:3px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.45);background:var(--ink)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px 11px;background:var(--ink);color:#fdedb5}
.hd .no{font:600 8px Poppins,sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:#f2d21b}
.hd h1{font:600 19px/1.2 "Playfair Display",Georgia,serif;margin:3px 0 0;color:#fdedb5}
.x{all:unset;cursor:pointer;color:#fdedb5;font:400 22px/1 Poppins,sans-serif;padding:2px 6px;margin:-2px -4px 0 0}
.x:focus-visible{outline:2px solid #fdedb5}
.mat{padding:14px 14px 12px;background:var(--ink)}.art{display:block;width:100%;height:auto;border-radius:4px}
.ft{padding:9px 14px 10px;background:var(--ink);color:#fdedb5;text-align:left}
.ft .l1{font:400 12px/1.4 "Playfair Display",Georgia,serif;font-style:italic}
.ft .l2{font:600 7.6px/1.4 Poppins,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:#f2d21b;margin-top:4px}
