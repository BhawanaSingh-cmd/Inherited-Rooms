:root{--ink:#14080f;--cream:#fdedb5;--gold:#f2d21b;--navy:#1f2a44;--wall:#2a2226;
--pink:#f7c9d4;--yellow:#fbeaa0;--lilac:#d9cdf0;--sage:#c9dcbf}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);color:var(--cream);font-family:Poppins,sans-serif}
body{-webkit-tap-highlight-color:transparent}
button{font:inherit}
/* top bar */
#bar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(rgba(20,8,15,.92),rgba(20,8,15,0));pointer-events:none}
#bar>*{pointer-events:auto}
#brand{font:600 10px/1.3 Poppins,sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:var(--cream);margin-right:auto}
#brand b{color:var(--gold);font-weight:600;display:block}
#count{font:600 10px Poppins,sans-serif;letter-spacing:1.6px;text-transform:uppercase;opacity:.8;white-space:nowrap}
.pill{all:unset;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:rgba(20,8,15,.82);color:var(--cream);font:600 10px Poppins,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:9px 14px;border-radius:30px;border:1px solid rgba(253,237,181,.3)}
.pill:hover{background:rgba(20,8,15,.96)}.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#addBtn{all:unset;position:fixed;right:18px;bottom:20px;z-index:30;cursor:pointer;background:var(--gold);color:var(--ink);font:700 11px Poppins,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:14px 20px;border-radius:40px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#addBtn:hover{background:#fff0a3}#addBtn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#demo{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:29;font:500 10.5px Poppins,sans-serif;background:rgba(20,8,15,.85);padding:8px 14px;border-radius:20px;border:1px dashed rgba(253,237,181,.4);white-space:nowrap}
/* wall */
#wall{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
background:radial-gradient(circle at 50% 40%,#3a2f33,#221b1e 75%)}
#wall.drag{cursor:grabbing}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
.note{all:unset;position:absolute;width:150px;height:150px;padding:14px 13px 10px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.15),0 8px 16px rgba(0,0,0,.35);font:700 19px/1.15 Caveat,NoteHand,cursive;color:var(--navy);overflow:hidden;transition:transform .2s,box-shadow .2s;display:block}
.note::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:rgba(0,0,0,.05)}
.note span{position:relative;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.note:hover,.note:focus-visible{z-index:9999!important;box-shadow:0 2px 2px rgba(0,0,0,.15),0 16px 28px rgba(0,0,0,.45);outline:none}
.note:focus-visible{outline:3px solid var(--gold)}
.note.new{animation:drop .7s cubic-bezier(.2,.8,.3,1.2)}
@keyframes drop{from{opacity:0;transform:translateY(-80px) rotate(0) scale(1.3)}}
.c-pink{background:var(--pink)}.c-yellow{background:var(--yellow)}.c-lilac{background:var(--lilac)}.c-sage{background:var(--sage)}
#empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font:italic 400 16px/1.6 "Playfair Display",Georgia,serif;opacity:.8;pointer-events:none}
/* modals */
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,8,15,.6);display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.card{width:min(480px,100%);max-height:calc(100% - 8px);overflow:auto;scrollbar-width:none;background:var(--ink);color:var(--cream);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.55);padding:20px 22px 22px;animation:rise .4s ease-out;position:relative}
.card::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.card,.note.new{animation:none}}
.eb{font:600 8.5px/1.4 Poppins,sans-serif;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold)}
.card h1,.card h2{font:600 26px/1.2 "Playfair Display",Georgia,serif;margin:8px 0 12px}
.card h2{font-size:22px}
.card p{font:400 14.5px/1.6 "Playfair Display",Georgia,serif;margin:0 0 12px}
.go{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;cursor:pointer;background:var(--gold);color:var(--ink);border-radius:6px;padding:12px 16px;font:700 11px/1.2 Poppins,sans-serif;letter-spacing:2.4px;text-transform:uppercase;margin-top:6px}
.go:hover{background:#fff0a3}.go:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.go[disabled]{opacity:.45;cursor:default}
.x{all:unset;position:absolute;right:14px;top:12px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;font-size:22px;color:var(--cream)}
.x:focus-visible{outline:2px solid var(--gold);border-radius:50%}
.lang{display:flex;gap:4px;justify-content:flex-end;margin:-4px -4px 4px 0}
.lang button{all:unset;cursor:pointer;font:600 10px Poppins,sans-serif;letter-spacing:1.4px;padding:6px 10px;border-radius:20px;color:var(--cream);border:1px solid rgba(253,237,181,.3)}
.lang button[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.lang button.hi{font:400 13px "Tiro Hindi",serif;padding:3px 10px}
.lang button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body.hi .card p,body.hi .q .qt,body.hi .chip,body.hi .hint{font-family:"Tiro Hindi",Poppins,serif}
body.hi .card p{font-size:15.5px;line-height:1.7}
.sw button.c-pink{background:var(--pink)}.sw button.c-yellow{background:var(--yellow)}.sw button.c-lilac{background:var(--lilac)}.sw button.c-sage{background:var(--sage)}
body.hi .eb,body.hi .lbl,body.hi #brand b,body.hi #count,body.hi .pill,body.hi #demo{font-family:"Tiro Hindi",Poppins,serif;letter-spacing:.3px;text-transform:none;font-size:13px;font-weight:400}
body.hi #addBtn{font-family:"Tiro Hindi",Poppins,serif;letter-spacing:.3px;text-transform:none;font-size:15px;font-weight:400}
body.hi .q .qn{letter-spacing:1px}
body.hi .go{font-family:"Tiro Hindi",Poppins,sans-serif;font-size:14px;letter-spacing:.5px;text-transform:none}
/* form */
.frame{font:italic 400 14px/1.55 "Playfair Display",Georgia,serif!important;margin:-4px 0 16px!important;padding:10px 12px;border-left:3px solid var(--gold);background:rgba(253,237,181,.06)}
body.hi .frame{font:400 15px/1.7 "Tiro Hindi",serif!important}
.q{margin:0 0 16px}
.q .qt{font:500 13.5px/1.45 Poppins,sans-serif;margin:0 0 8px}
.q .qn{font:600 8.5px Poppins,sans-serif;letter-spacing:2px;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font:500 12px Poppins,sans-serif;padding:7px 12px;border-radius:20px;border:1px solid rgba(253,237,181,.35);color:var(--cream)}
.chip[aria-pressed=true]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body.hi .chip{font-size:14px}
.sw{display:flex;gap:10px;margin:4px 0 12px}
.sw button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.4);position:relative}
.sw button[aria-pressed=true]::after{content:"";position:absolute;inset:-5px;border:2px solid var(--cream);border-radius:7px}
.sw button:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
.pad{border-radius:3px;padding:14px;margin-bottom:6px;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:background .2s}
textarea{all:unset;box-sizing:border-box;display:block;width:100%;min-height:118px;font:700 22px/1.2 Caveat,NoteHand,cursive;color:var(--navy);white-space:pre-wrap;word-break:break-word}
textarea::placeholder{color:rgba(31,42,68,.45)}
.hint{font:400 11px/1.4 Poppins,sans-serif;opacity:.7;display:flex;justify-content:space-between;margin:2px 0 12px}
.lbl{font:600 8.5px Poppins,sans-serif;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin:0 0 6px;display:block}
.sep{border:0;border-top:1px solid rgba(253,237,181,.2);margin:4px 0 16px}
/* reader */
#reader .card{background:transparent;box-shadow:none;padding:0;width:min(400px,100%);overflow:visible}
#rnote{position:relative;padding:28px 24px 20px;box-shadow:0 18px 40px rgba(0,0,0,.5);color:var(--navy);transform:rotate(-1.5deg)}
#rnote .txt{font:700 28px/1.2 Caveat,NoteHand,cursive;white-space:pre-wrap;word-break:break-word;margin:0 0 14px}
#rnote .ans{border-top:1px dashed rgba(31,42,68,.3);padding-top:10px;font:400 12px/1.5 Poppins,sans-serif;color:#3a3f55}
#rnote .ans div{margin:0 0 6px}
#rnote .ans b{display:block;font:600 8px Poppins,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#6b6f80}
body.hi #rnote .ans{font-family:"Tiro Hindi",Poppins,serif;font-size:13.5px}
#rnote .date{font:600 8.5px Poppins,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#6b6f80;margin-top:6px}
#reader .x{right:-6px;top:-40px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--cream);font:500 13px/1.5 Poppins,sans-serif;padding:12px 18px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
body.hi #toast{font-family:"Tiro Hindi",Poppins,serif;font-size:14.5px}
@media (max-width:560px){#count{display:none}#brand{font-size:9px}.pill{padding:8px 11px}#demo{bottom:78px}}

var BAD=/(f+u+c+k|sh[i1]+t|b[i1]tch|sl[u]t|wh[o0]re|bastard|c[u]nt|\bd[i1]ck|pu[s5]{2}y|\brap(e|ist)|r[a@]nd[i1]|ch[aeiou]{0,2}t[iy]+a|madar ?ch[o0]d|maa?d[a@]rch[o0]d|b[e]?h[e]?n ?ch[o0]d|bhen ?ch[o0]d|\bmc\b|\bbc\b|g[a@]{1,2}ndu|\bg[a@]{1,2}nd\b|\bl[u]nd\b|l[a@]u?d[a@]|l[a@]vd[a@]|bh[o0]sd[i1]|bh[o0]sad|har[a@]m[i1]|kut(t)?[i1]y[a@]|kamin[ai]|रंडी|चूतिया|चुतिया|मादरचोद|बहनचोद|भेनचोद|गांडू|गाँडू|लंड|लौड़ा|भोसड़ी|हरामी|कुतिया|कमीन|https?:\/\/|www\.|\.com\b)/i;
function looksBad(s){var n=s.toLowerCase().replace(/@/g,'a').replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/\$/g,'s');var a=n.replace(/[*#.\-_]/g,''),b=n.replace(/[*#]/g,'u');return BAD.test(n)||BAD.test(a)||BAD.test(b)||BAD.test(a.replace(/[^a-zऀ-ॿ]/g,''))}

/* ---------- wall ---------- */
var wall=document.getElementById('wall'),board=document.getElementById('board');
var BW=0,BH=0,panX=0,panY=0,CELL=170;
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rnd(seed){var x=seed||1;return function(){x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%10000)/10000}}
function layout(){var n=Math.max(notes.length,1),W=innerWidth,H=innerHeight;
 var area=Math.max(W*H*1.15,n*CELL*CELL*1.25);var asp=Math.max(W/H,.8);BW=Math.ceil(Math.sqrt(area*asp));BH=Math.ceil(area/BW);
 BW=Math.max(BW,W+120);BH=Math.max(BH,H+120);
 var cols=Math.max(1,Math.floor((BW-80)/CELL)),rows=Math.max(1,Math.ceil(n/cols));
 var cells=[];for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)cells.push([c,r]);
 var R=rnd(hash('wall'+notes.length));for(var i=cells.length-1;i>0;i--){var j=Math.floor(R()*(i+1));var tmp=cells[i];cells[i]=cells[j];cells[j]=tmp}
 var offX=(BW-cols*CELL)/2,offY=Math.max(70,(BH-rows*CELL)/2);
 notes.forEach(function(nt,i){var r2=rnd(hash(String(nt.id))),cell=cells[i%cells.length];
  nt._x=offX+cell[0]*CELL+(r2()-.5)*70;nt._y=offY+cell[1]*CELL+(r2()-.5)*60;nt._r=(r2()-.5)*14})}
function el(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e}
function draw(newId){layout();board.innerHTML='';board.style.width=BW+'px';board.style.height=BH+'px';
 notes.forEach(function(nt,i){var b=el('button','note c-'+(COLORS.indexOf(nt.color)>-1?nt.color:'yellow'));
  b.style.left=nt._x+'px';b.style.top=nt._y+'px';b.style.transform='rotate('+nt._r.toFixed(1)+'deg)';b.style.zIndex=i+1;
  var s=el('span');s.textContent=nt.body;b.appendChild(s);b.setAttribute('aria-label','Note: '+nt.body);
  b.addEventListener('click',function(e){if(moved>6)return;openReader(nt)});
  if(newId&&nt.id===newId)b.classList.add('new');board.appendChild(b)});
 document.getElementById('empty').style.display=notes.length?'none':'flex';
 updateCount();
 if(newId){var nt=notes.filter(function(x){return x.id===newId})[0];if(nt){panX=innerWidth/2-nt._x-75;panY=innerHeight/2-nt._y-75}}
 else{panX=(innerWidth-BW)/2;panY=(innerHeight-BH)/2}
 clampPan()}
function updateCount(){document.getElementById('count').textContent=T[lang].count(notes.length)}
function clampPan(){panX=Math.min(0,Math.max(innerWidth-BW,panX));panY=Math.min(0,Math.max(innerHeight-BH,panY));board.style.transform='translate('+panX+'px,'+panY+'px)'}
addEventListener('resize',function(){draw()});
var down=null,moved=0;
wall.addEventListener('pointerdown',function(e){down=[e.clientX,e.clientY,panX,panY];moved=0});
addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-down[0],dy=e.clientY-down[1];moved=Math.abs(dx)+Math.abs(dy);if(moved>6){wall.classList.add('drag');panX=down[2]+dx;panY=down[3]+dy;clampPan()}});
addEventListener('pointerup',function(){down=null;wall.classList.remove('drag');setTimeout(function(){moved=0},0)});
wall.addEventListener('wheel',function(e){e.preventDefault();panX-=e.shiftKey?e.deltaY:e.deltaX;panY-=e.shiftKey?0:e.deltaY;clampPan()},{passive:false});

function openReader(nt){lastFocus=document.activeElement;rnote.className='c-'+nt.color;rnote.innerHTML='';
 var tx=el('p','txt');tx.textContent=nt.body;rnote.appendChild(tx);

 var p=el('p','qt');p.textContent=Q[k][lang];p.id='q_'+k;w.appendChild(p);var c=el('div','chips');c.setAttribute('role','group');c.setAttribute('aria-labelledby','q_'+k);
 Q[k].o[lang].forEach(function(o,oi){var b=el('button','chip');b.type='button';b.textContent=o;var on=Q[k].multi?(answers[k]||[]).indexOf(oi)>-1:answers[k]===oi;b.setAttribute('aria-pressed',on);
  b.onclick=function(){if(Q[k].multi){var a=(answers[k]||[]).slice(),x=a.indexOf(oi);if(x>-1)a.splice(x,1);else a.push(oi);a.sort();if(a.length)answers[k]=a;else delete answers[k]}else{answers[k]=answers[k]===oi?undefined:oi;if(answers[k]===undefined)delete answers[k]}renderQs()};c.appendChild(b)});
 w.appendChild(c);qs.appendChild(w)})}
var sw=document.getElementById('sw'),pad=document.getElementById('pad');
COLORS.forEach(function(c){var b=el('button','c-'+c);b.type='button';b.setAttribute('aria-label',c);b.onclick=function(){color=c;paint()};sw.appendChild(b)});
function paint(){pad.className='pad c-'+color;sw.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.classList.contains('c-'+color))})}
function openForm(){picked=pickQuestions();answers={};color=COLORS[Math.floor(Math.random()*4)];ta.value='';cc();renderQs();paint();form.classList.add('on');setTimeout(function(){var f=qs.querySelector('.chip');(f||ta).focus()},50)}
function closeForm(){form.classList.remove('on');document.getElementById('addBtn').focus()}
function cc(){var n=ta.value.trim().length;document.getElementById('cc').textContent=ta.value.length+'/240';postBtn.disabled=n<3}
ta.addEventListener('input',cc);
document.getElementById('addBtn').onclick=openForm;
document.getElementById('formX').onclick=closeForm;
form.addEventListener('click',function(e){if(e.target===form)closeForm()});
postBtn.onclick=function(){var body=ta.value.trim().slice(0,240);if(body.length<3)return;
 if(Date.now()-lastPost<20000){toast(t('wait'));return}
 postBtn.disabled=true;var ans={};Object.keys(answers).forEach(function(k){ans[k]=answers[k]});
 post(color,body,ans).then(function(row){lastPost=Date.now();form.classList.remove('on');
  if(row&&row.visible){var n={id:row.id,color:color,body:body,answers:ans,lang:lang,created_at:row.created_at||now()};notes.push(n);draw(n.id);toast(t('posted'))}
  else toast(t('held'));
  document.getElementById('addBtn').focus()}).catch(function(e){console.error(e);toast(t('err'));postBtn.disabled=false})};

var tt;function toast(m){var x=document.getElementById('toast');x.textContent=m;x.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){x.classList.remove('on')},4200)}
addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(reader.classList.contains('on'))closeReader();else if(form.classList.contains('on'))closeForm()});
document.getElementById('introGo').onclick=function(){document.getElementById('intro').classList.remove('on');document.getElementById('addBtn').focus()};
applyLang();load();
if(LIVE)setInterval(function(){if(form.classList.contains('on')||reader.classList.contains('on'))return;sb.from('notes').select('id,color,body,answers,lang,created_at').order('created_at',{ascending:true}).limit(800).then(function(r){if(!r.error&&r.data&&r.data.length!==notes.length){notes=r.data;draw()}})},45000);
})();
