<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Inherited Rooms</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#14080f}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#14080f}
</style></head><body>
<iframe id="frame" title="The Inherited Rooms" allow="autoplay; fullscreen; accelerometer; gyroscope"></iframe>
<script>
/* The exhibition shell: rooms load inside this frame, so the music here keeps playing between rooms. */
(function(){
var OK=/^(hallway|room1|room2|archive)\/index\.html(\?[\w=&]*)?$/;
var frame=document.getElementById('frame');
var start=decodeURIComponent((location.hash||'').slice(1));
frame.src=OK.test(start)?start:'hallway/index.html';

var LOW=0.22,K_ON='inheritedRooms.music',K_POS='inheritedRooms.musicPos';
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var on=get(K_ON)!=='off',duck=false,quiet=false,blocked=false,target=0,raf=0;
var a=new Audio('music/bg.mp3');a.loop=true;a.preload='auto';a.volume=0;
var pos=parseFloat(get(K_POS)||'0');
a.addEventListener('loadedmetadata',function(){if(pos>0&&pos<a.duration)try{a.currentTime=pos}catch(e){}});
function ramp(){var v=a.volume,d=target-v;if(Math.abs(d)<.004){a.volume=target;if(target===0)a.pause();raf=0;return}a.volume=Math.max(0,Math.min(1,v+d*.05));raf=requestAnimationFrame(ramp)}
function level(){return on?LOW*(quiet?.6:1)*(duck?.4:1):0}
function apply(){target=level();if(target>0&&a.paused){play();return}if(!raf)raf=requestAnimationFrame(ramp)}
function play(){if(!on)return;a.play().then(function(){blocked=false;tell();target=level();if(!raf)raf=requestAnimationFrame(ramp)}).catch(function(){blocked=true;tell()})}
function tell(){try{frame.contentWindow.postMessage({mus:'state',on:on,blocked:blocked&&on},'*')}catch(e){}}
setInterval(function(){if(!a.paused)set(K_POS,String(a.currentTime))},1000);
addEventListener('pagehide',function(){if(!a.paused)set(K_POS,String(a.currentTime))});
document.addEventListener('visibilitychange',function(){if(document.hidden){a.pause()}else if(on){play()}});
addEventListener('message',function(e){var m=e.data;if(!m||!m.mus)return;
 if(m.mus==='hello'){duck=false;quiet=!!m.quiet;if(m.page&&OK.test(m.page)){try{history.replaceState(null,'','#'+m.page)}catch(x){}}if(m.title)document.title=m.title;tell();apply()}
 else if(m.mus==='gesture'){if(on&&(a.paused||blocked))play()}
 else if(m.mus==='toggle'){on=!on;set(K_ON,on?'on':'off');if(on)play();else{target=0;if(!raf)raf=requestAnimationFrame(ramp)}tell()}
 else if(m.mus==='duck'){duck=!!m.v;apply()}});
addEventListener('pointerdown',function(){if(on&&a.paused)play()});
play(); /* try to start straight away; browsers that block this start on the first tap */
})();
</script></body></html>
